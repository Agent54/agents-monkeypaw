# =============================================================================
# Security Hardening Layer
# =============================================================================
# 1. Seccomp: tight syscall allowlist (applied via docker-compose security_opt)
# 2. Landlock: filesystem access restrictions (applied at runtime via entrypoint)
# 3. Network: iptables egress filtering (applied at runtime via entrypoint)
# 4. Capabilities: all dropped except minimal set (via docker-compose cap_drop)
# 5. Read-only rootfs with explicit tmpfs/volume mounts
# 6. Non-root user with no sudo

services:
  base:
    profiles:
      - build
    image: opencode-monkeypaw-base:local
    build:
      context: ../../..
      dockerfile: packages/opencode/monkeypaw/base.Dockerfile

  proxy:
    image: opencode-monkeypaw-proxy:local
    build:
      context: ../../..
      dockerfile: packages/opencode/monkeypaw/proxy/Dockerfile
    develop:
      watch:
        - action: sync
          path: proxy/main.capnp
          target: /app/main.capnp
        - action: sync
          path: proxy/main.js
          target: /app/main.js
        - action: sync
          path: proxy/ui.js
          target: /app/ui.js
        - action: sync
          path: proxy/client.js
          target: /app/client.js
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /sockets/internal/permission-broker.sock && test -s /mitm-ca/mitmproxy-ca-cert.pem && test -s /mitm-ca/workerd-proxy-cert.pem && node -e "const net=require('node:net');const s=net.connect('/sockets/internal/permission-broker.sock');const t=setTimeout(()=>process.exit(1),1000);s.once('connect',()=>{clearTimeout(t);s.end();process.exit(0)});s.once('error',()=>process.exit(1))"
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    networks:
      - isolated
      - default
    ports:
      - "8080:8080"
      - "8443:8443"
      - "4097:4097"
      - "4098:4098"
    volumes:
      - mitm-ca:/mitm-ca
      - proxy-internal:/sockets/internal
      - type: bind
        source: /tmp/opencode-monkeypaw-proxy
        target: /sockets/external

  mcp-everything:
    extends:
      file: compose.security.yaml
      service: secured
    build:
      context: .
      dockerfile: Dockerfile.mcp-everything
    user: "node"
    networks:
      - isolated
    depends_on:
      # egress-proxy:
      #   condition: service_healthy
      proxy:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_EXTRA_CA_CERTS: "/mitm-ca/mitmproxy-ca-cert.pem"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/sse').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - mitm-ca:/mitm-ca:ro
  agent:
    image: opencode-monkeypaw-agent:local
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: packages/opencode/monkeypaw/Dockerfile
    depends_on:
      # egress-proxy:
      #   condition: service_healthy
      proxy:
        condition: service_healthy
    environment:
      DENO_PERMISSION_BROKER_PATH: /tmp/opencode-proxy/permission-broker.sock
      # GIT_CONFIG_COUNT: "1"
      # GIT_CONFIG_KEY_0: "safe.directory"
      # GIT_CONFIG_VALUE_0: "*"
      NO_PROXY: "agent,proxy,mcp-everything,localhost,127.0.0.1"
      OPENCODE_CONFIG_DIR: "/stacks/agents/opencode/packages/opencode/monkeypaw/conf/opencode"
      OPENCODE_MOUNT_ROOT: "/stacks"
      OPENCODE_TEST_HOME: "/stacks"
      OPENCODE_WORKSPACE_ROOT: "/stacks/agents/workspaces"
      OPENCODE_WORKTREE_ROOT: "/stacks/agents/workspaces/worktree"
      OPENROUTER_API_KEY: ""
      # OPENCODE_SERVER_PASSWORD: "5a7ca64d097eb96aee23395fb7feda88c2d30ce627fbd66766ef306c"
      DENO_CERT: "/mitm-ca/mitmproxy-ca-cert.pem"
      NODE_EXTRA_CA_CERTS: "/mitm-ca/mitmproxy-ca-cert.pem"
      no_proxy: "agent,proxy,mcp-everything,localhost,127.0.0.1"
      DENO_AUDIT_PERMISSIONS: "/stacks/agents/data/state/opencode/deno-permissions.audit.jsonl"
      DENO_DIR: "/stacks/agents/data/cache/deno"
      OPENCODE_DATA_DIR: "/stacks/agents/data/opencode"
      OPENCODE_STATE_DIR: "/stacks/agents/data/state/opencode"
      OPENCODE_CACHE_DIR: "/stacks/agents/data/cache/opencode"
      XDG_CONFIG_HOME: "/stacks/agents/data/config"
      XDG_CACHE_HOME: "/stacks/agents/data/cache"
      XDG_DATA_HOME: "/stacks/agents/data"
      XDG_STATE_HOME: "/stacks/agents/data/state"
      HOME: "/stacks"
    extends:
      file: compose.security.yaml
      service: secured
    # Git worktrees write objects into the original repo's common .git/objects
    # directory, so the container user must match the host owner of /stacks.
    # Defaults match macOS' first local user; override on Linux with:
    # HOST_UID="$(id -u)" HOST_GID="$(id -g)".
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    networks:
      - isolated
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -S /tmp/opencode-proxy/permission-broker.sock && socat -T 1 -u OPEN:/dev/null UNIX-CONNECT:/tmp/opencode-proxy/permission-broker.sock >/dev/null 2>&1 && curl -fsS -o /dev/null -u opencode:5a7ca64d097eb96aee23395fb7feda88c2d30ce627fbd66766ef306c http://localhost:4097/global/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - '${STACKS_PATH}:/stacks:rw'
      - mitm-ca:/mitm-ca:ro
      - proxy-internal:/tmp/opencode-proxy
    tmpfs:
      - /tmp:size=256M,nosuid,exec
      - /run:size=64M

# Permission UI: http://localhost:4097/permissions
# Agent proxy: http://localhost:4098
# OPENCODE_SERVER_PASSWORD="5a7ca64d097eb96aee23395fb7feda88c2d30ce627fbd66766ef306c" opencode attach http://localhost:4098

volumes:
  mitm-ca:
  proxy-internal:

networks:
  isolated:
    internal: true
